name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Binary, tarball and .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/netfolders/bin
          cp -r src data Cargo.toml Cargo.lock install.sh uninstall.sh \
                README.md README.fr.md CHANGELOG.md LICENSE dist/netfolders/
          cp target/release/netfolders dist/netfolders/bin/
          tar -C dist -czf "dist/netfolders-$VERSION-x86_64.tar.gz" netfolders
          packaging/debian/build-deb.sh target/release/netfolders "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: netfolders-linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita smbclient cifs-utils polkit

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          git config --global --add safe.directory "$PWD"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          # makepkg utilise l'archive locale au lieu de la télécharger
          git archive --prefix="NetFolders-$VERSION/" -o "packaging/arch/netfolders-$VERSION.tar.gz" HEAD
          useradd -m builder
          chown -R builder packaging/arch
          su builder -c "cd packaging/arch && makepkg --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: netfolders-arch
          path: packaging/arch/*.pkg.tar.zst

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          grep -q "^version = \"$VERSION\"" Cargo.toml \
            || { echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version de Cargo.toml"; exit 1; }
          # Notes de version : la section correspondante du CHANGELOG
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "NetFolders $VERSION" --notes-file notes.md
