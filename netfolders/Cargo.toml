[package]
name = "netfolders"
version = "0.1.0"
edition = "2021"
description = "Assistant graphique pour monter un dossier réseau (NAS SMB/CIFS) sous Fedora"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
strip = true
