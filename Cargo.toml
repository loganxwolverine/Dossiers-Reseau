[package]
name = "netfolders"
version = "0.3.0"
edition = "2021"
description = "Mount and manage NAS network folders (SMB/CIFS) on Linux, with a GTK4/libadwaita interface"
license = "MIT"
repository = "https://github.com/loganxwolverine/NetFolders"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
strip = true
